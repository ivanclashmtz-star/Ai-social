
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08061b">
<title>AI Social · V9 IA</title>
<style>
:root{
  --bg:#08061b;--panel:#12102b;--panel2:#18143a;--text:#fff;--muted:#aaa7c4;
  --pink:#ff2d9b;--purple:#7b3ff2;--blue:#2587ff;--orange:#ff6138;--line:#ffffff18;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:430px;margin:auto;min-height:100vh;padding-bottom:92px}
header{padding:20px 18px 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#0b0820,#100b29)}
.logo{font-size:34px;font-weight:900;letter-spacing:-1.5px;background:linear-gradient(90deg,#ff299d,#6e7cff);-webkit-background-clip:text;color:transparent}
.spark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff299d,#8645f4);font-size:28px}
main{padding:18px 16px 24px}
h1{font-size:42px;line-height:1.05;margin:22px 0 8px}
h2{font-size:30px;margin:0 0 8px}
h3{margin:0 0 8px}
.subtitle{font-size:20px;color:var(--muted);line-height:1.4;margin:0 0 26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid var(--line);border-radius:28px;padding:26px 20px;min-height:190px;color:#fff;text-align:left;box-shadow:0 15px 45px #0004}
.card .emoji{font-size:38px;display:block;margin-bottom:25px}
.card strong{display:block;font-size:20px;margin-bottom:8px}
.card span{font-size:17px;line-height:1.35}
.c1{background:linear-gradient(145deg,#e71a91,#7926e6)}
.c2{background:linear-gradient(145deg,#ff721d,#f1275d)}
.c3{background:linear-gradient(145deg,#1687ef,#2656d8)}
.c4{background:linear-gradient(145deg,#6531e6,#4320b8)}
.section{margin-top:34px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sectionhead a{color:#fff;font-size:17px}
.empty{border:1px dashed #ffffff30;border-radius:22px;padding:24px;color:var(--muted);text-align:center}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:82px;background:#100d29f2;border-top:1px solid #ffffff15;display:grid;grid-template-columns:repeat(5,1fr);backdrop-filter:blur(16px);z-index:10}
.navbtn{border:0;background:none;color:#77748f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px}
.navbtn b{font-size:25px;line-height:1}
.navbtn.active{color:#ff3aa6}
.back{border:0;background:none;color:#c9c6db;font-size:18px;padding:4px 0;margin-bottom:18px}
.form{display:grid;gap:18px}
label{font-weight:800;font-size:17px}
input,select,textarea{width:100%;margin-top:8px;background:#13102f;border:1px solid #ffffff18;border-radius:20px;color:#fff;padding:17px 16px;outline:none}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#a45cff}
.primary{border:0;border-radius:18px;padding:17px;background:linear-gradient(90deg,#ff239b,#733cff);color:#fff;font-weight:800;font-size:18px}
.secondary{border:1px solid #ffffff20;border-radius:18px;padding:15px;background:#15122f;color:#fff;font-weight:700}
.notice{background:#171333;border:1px solid #ffffff12;border-radius:18px;padding:14px;color:#c9c5dd;font-size:14px;line-height:1.4}
.char{display:flex;gap:14px;align-items:center;background:#14102f;border:1px solid #ffffff14;border-radius:24px;padding:16px;margin-bottom:12px}
.avatar{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#ff2d9b,#633cf3);font-size:29px;flex:none}
.char .info{min-width:0;flex:1}
.char .name{font-size:18px;font-weight:800}
.char .meta{color:var(--muted);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char button{border:0;border-radius:13px;background:#292052;color:#fff;padding:10px}
.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#fff;color:#100d25;border-radius:15px;padding:12px 16px;font-weight:700;z-index:20;box-shadow:0 10px 30px #0006;display:none}
.small{font-size:13px;color:var(--muted)}
.form-section{background:#0f0c25;border:1px solid #ffffff12;border-radius:22px;padding:16px}
.form-section h3{font-size:21px;margin:0 0 14px}
.hint{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.35}
.conditional{display:none}

.chat-head{display:flex;align-items:center;gap:12px;background:#14102f;border:1px solid #ffffff14;border-radius:22px;padding:12px;margin-bottom:14px}
.chat-head .avatar{width:50px;height:50px;font-size:25px}
.chat-messages{display:flex;flex-direction:column;gap:8px;min-height:45vh;padding:8px 2px 14px}
.msg-row{display:flex;width:100%;touch-action:pan-y}
.msg-row.user{justify-content:flex-end}
.msg{max-width:82%;position:relative;border-radius:20px;padding:11px 13px;background:#171333;border:1px solid #ffffff12;box-shadow:0 7px 20px #0002;user-select:none;transition:transform .12s}
.msg-row.user .msg{background:linear-gradient(135deg,#6328d9,#8d2dbe)}
.msg .reply-ref{border-left:3px solid #ff3aa6;background:#0e0b25aa;border-radius:10px;padding:7px 9px;margin-bottom:8px;font-size:12px;color:#ddd8ee}
.msg .reply-ref b{display:block;color:#ff8ac9;margin-bottom:2px}
.msg-text{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.35}
.msg-time{display:block;color:#bbb5cf;font-size:10px;text-align:right;margin-top:5px}
.reply-bar{display:none;align-items:center;gap:10px;background:#171333;border:1px solid #ffffff14;border-radius:16px;padding:9px 11px;margin-bottom:8px}
.reply-bar.show{display:flex}
.reply-bar .reply-content{min-width:0;flex:1;border-left:3px solid #ff3aa6;padding-left:9px}
.reply-bar b{display:block;font-size:12px;color:#ff8ac9}
.reply-bar span{display:block;color:#c9c5dd;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-cancel{border:0;background:none;color:#aaa7c4;font-size:22px;padding:4px 7px}
.chat-compose{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,#08061b 18%);padding:12px 0 4px}
.chat-compose form{display:flex;gap:8px;align-items:flex-end}
.chat-compose textarea{margin:0;min-height:50px;max-height:130px;resize:none;border-radius:18px;padding:14px}
.chat-send{border:0;border-radius:17px;width:52px;height:52px;background:linear-gradient(135deg,#ff239b,#733cff);color:#fff;font-size:21px;font-weight:800}
.swipe-hint{font-size:12px;color:var(--muted);text-align:center;margin:-2px 0 10px}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="logo" style="border:0;background:none;padding:0" onclick="go('home')">AI Social</button>
  <div class="spark">✦</div>
</header>

<main id="content"></main>

<nav>
  <button class="navbtn active" data-nav="home" onclick="go('home')"><b>⌂</b>Inicio</button>
  <button class="navbtn" data-nav="characters" onclick="go('characters')"><b>◉</b>Personajes</button>
  <button class="navbtn" data-nav="chats" onclick="go('chats')"><b>◌</b>Chats</button>
  <button class="navbtn" data-nav="create" onclick="go('create')"><b>＋</b>Crear</button>
  <button class="navbtn" data-nav="profile" onclick="go('profile')"><b>♙</b>Perfil</button>
</nav>
<div id="toast" class="toast"></div>
</div>

<script>
const KEY="ai_social_characters_v8";
const getChars=()=>JSON.parse(localStorage.getItem(KEY)||"[]");
const saveChars=(x)=>localStorage.setItem(KEY,JSON.stringify(x));
const content=document.getElementById("content");

function go(page){
  history.replaceState({}, "", "#"+page);
  render(page);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>render(location.hash.slice(1)||"home"));

function render(page){
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.nav===page));
  if(page==="create") return renderCreate();
  if(page==="characters") return renderCharacters();
  if(page==="chats") return renderChats();
   if(page==="chat") return renderChat();
  if(page==="profile") return renderProfile();
  renderHome();
}

function renderHome(){
  const chars=getChars();
  content.innerHTML=`
    <h1>¡Hola! 👋</h1>
    <p class="subtitle">Crea y conoce personajes que cobran vida con IA.</p>
    <div class="grid">
      <button class="card c1" onclick="go('characters')"><span class="emoji">👥</span><strong>Mis personajes</strong><span>Gestiona tus personajes.</span></button>
      <button class="card c2" onclick="go('create')"><span class="emoji">✨</span><strong>Crear personaje</strong><span>Diseña uno nuevo.</span></button>
      <button class="card c3" onclick="go('chats')"><span class="emoji">💬</span><strong>Mis chats</strong><span>Continúa tus conversaciones.</span></button>
      <button class="card c4" onclick="showToast('La exploración llegará en el siguiente paso.')"><span class="emoji">🌌</span><strong>Explorar</strong><span>Descubre personajes.</span></button>
    </div>
    <section class="section">
      <div class="sectionhead"><h2>Tus personajes</h2><a onclick="go('characters')">Ver todos ›</a></div>
      ${chars.length ? chars.slice(0,3).map(charMini).join("") : `<div class="empty">Todavía no tienes personajes.<br><br><button class="primary" onclick="go('create')">Crear mi primer personaje</button></div>`}
    </section>`;
}


const OPTION_CATALOG={
  skin:["Muy claro · rosado","Claro · melocotón","Claro · rosado","Medio · beige","Medio · cálido","Moreno claro · caramelo","Moreno · marrón cálido","Moreno oscuro · cacao","Muy oscuro · marrón profundo"],
  bodyType:["Delgado","Promedio","Atlético","Curvo","Musculoso","Robusto"],
  penisSize:["Pequeño","Mediano","Grande","Gigante"],
  breastSize:["Planos","Pequeños","Medianos","Grandes","Gigantes"],
  gluteSize:["Pequeños","Medianos","Grandes","Gigantes"],
  hairType:["Lacio","Ondulado","Rizado","Calvo"],
  hairLength:["Corto","Mediano","Largo"],
  hairExtra:["Ninguno","Flequillo","Moño","Cola de caballo"],
  hairColor:["Negro","Castaño oscuro","Castaño","Rubio oscuro","Rubio","Pelirrojo","Gris","Blanco","Rosa","Azul","Morado","Verde"],
  eyeColor:["Marrón oscuro","Marrón","Ámbar","Avellana","Verde","Azul","Gris","Negro","Violeta","Rojo"],
  height:["Muy bajo/a","Bajo/a","Mediano/a","Alto/a","Muy alto/a"]
};

const IMAGE_SLOTS=Object.fromEntries(
  Object.keys(OPTION_CATALOG).map(k=>[k,Object.fromEntries(OPTION_CATALOG[k].map(v=>[v,null]))])
);

function getImageSlot(field,value){
  return IMAGE_SLOTS[field]?.[value]||null;
}

function renderCreate(){
 content.innerHTML=`
 <button class="back" onclick="go('home')">← Inicio</button>
 <h2>Crear personaje</h2>
 <p class="subtitle">Define su personalidad y su apariencia.</p>
 <div class="notice">La edad mínima es 18 años. Los datos se guardan localmente en este navegador; más adelante los conectaremos con la IA.</div><br>
 <form class="form" id="form">
   <div class="form-section">
     <h3>Información básica</h3>
     <label>Nombre<input id="name" required placeholder="Ej. Alex"></label><br>
     <label>Edad<input id="age" required type="number" min="18" placeholder="18 o más"></label><br>
     <label>Género<select id="gender" required onchange="togglePhysicalFields()"><option value="">Selecciona...</option><option>Hombre</option><option>Mujer</option><option>Trans</option></select></label><br>
     <label>Nacionalidad<input id="nationality" list="countrySuggestions" required placeholder="Ej. México, Japón, Francia..."><datalist id="countrySuggestions"><option>México</option><option>Estados Unidos</option><option>Canadá</option><option>Brasil</option><option>Argentina</option><option>Colombia</option><option>España</option><option>Francia</option><option>Italia</option><option>Alemania</option><option>Reino Unido</option><option>Rusia</option><option>Turquía</option><option>Egipto</option><option>Marruecos</option><option>Sudáfrica</option><option>India</option><option>China</option><option>Japón</option><option>Corea del Sur</option><option>Australia</option></datalist><div class="hint">Puedes escribir cualquier país; no está limitada a una lista cerrada.</div></label>
   </div>
   <div class="form-section">
     <h3>Apariencia</h3>
     <label>Color de piel<select id="skin"><option>Muy claro · rosado</option><option>Claro · melocotón</option><option>Claro · rosado</option><option>Medio · beige</option><option>Medio · cálido</option><option>Moreno claro · caramelo</option><option>Moreno · marrón cálido</option><option>Moreno oscuro · cacao</option><option>Muy oscuro · marrón profundo</option></select></label><br>
     <label>Tipo de cuerpo<select id="bodyType"><option>Delgado</option><option>Promedio</option><option>Atlético</option><option>Curvo</option><option>Musculoso</option><option>Robusto</option></select></label><br>
     <div id="penisField" class="conditional"><label>Tamaño del pene<select id="penisSize"><option>Pequeño</option><option>Mediano</option><option>Grande</option><option>Gigante</option></select></label><br></div>
     <div id="breastsField" class="conditional"><label>Tamaño de los senos<select id="breastSize"><option>Planos</option><option>Pequeños</option><option>Medianos</option><option>Grandes</option><option>Gigantes</option></select></label><br></div>
     <div id="glutesField" class="conditional"><label>Tamaño de los glúteos<select id="gluteSize"><option>Pequeños</option><option>Medianos</option><option>Grandes</option><option>Gigantes</option></select></label><br></div>
     <label>Tipo de pelo<select id="hairType"><option>Lacio</option><option>Ondulado</option><option>Rizado</option><option>Calvo</option></select></label><br>
     <label>Largo del pelo<select id="hairLength"><option>Corto</option><option>Mediano</option><option>Largo</option></select></label><br>
     <label>Extras en el pelo<select id="hairExtra"><option>Ninguno</option><option>Flequillo</option><option>Moño</option><option>Cola de caballo</option></select></label><br>
     <label>Color del pelo<select id="hairColor"><option>Negro</option><option>Castaño oscuro</option><option>Castaño</option><option>Rubio oscuro</option><option>Rubio</option><option>Pelirrojo</option><option>Gris</option><option>Blanco</option><option>Rosa</option><option>Azul</option><option>Morado</option><option>Verde</option></select></label><br>
     <label>Color de ojos<select id="eyeColor"><option>Marrón oscuro</option><option>Marrón</option><option>Ámbar</option><option>Avellana</option><option>Verde</option><option>Azul</option><option>Gris</option><option>Negro</option><option>Violeta</option><option>Rojo</option></select></label><br>
     <label>Estatura<select id="height"><option>Muy bajo/a</option><option>Bajo/a</option><option>Mediano/a</option><option>Alto/a</option><option>Muy alto/a</option></select></label>
   </div>
   <div class="form-section">
     <h3>Personalidad y estilo</h3>
     <label>Personalidad<input id="personality" required placeholder="Ej. divertido, seguro, curioso"></label><br>
     <label>Forma de hablar<select id="speech"><option>Natural y amistosa</option><option>Divertida y juguetona</option><option>Seria y tranquila</option><option>Directa y segura</option></select></label><br>
     <label>Gustos e intereses<input id="interests" placeholder="Ej. música, videojuegos, viajes"></label><br>
     <label>Descripción<textarea id="description" placeholder="Cuenta brevemente quién es este personaje..."></textarea></label>
   </div>
   <div class="form-section">
     <h3>Contexto inicial</h3>
     <p class="hint">Describe libremente la situación en la que comienza vuestra historia. Estos datos ayudarán a la IA a interpretar la relación y la escena inicial.</p>
     <label>¿Qué relación tienes con el personaje?<textarea id="relationship" placeholder="Ej. Somos compañeros de trabajo, pero apenas nos conocemos."></textarea></label><br>
     <label>¿Dónde se conocen o dónde comienza la historia?<textarea id="meetingPlace" placeholder="Ej. En una cafetería después del trabajo."></textarea></label><br>
     <label>¿Cuándo ocurre el encuentro?<textarea id="meetingTime" placeholder="Ej. Una noche de viernes, alrededor de las 9."></textarea></label><br>
     <label>¿A qué se dedica el personaje?<textarea id="profession" placeholder="Ej. Es fotógrafa profesional y trabaja para una revista."></textarea></label><br>
     <label>¿Qué está ocurriendo al comenzar la conversación?<textarea id="initialSituation" placeholder="Ej. Estamos sentados en una cafetería y acaba de terminar su turno."></textarea></label>
   </div>
   <label>Avatar<select id="avatar"><option>👩</option><option>👨</option><option>🧑</option><option>🦊</option><option>🐱</option><option>🤖</option><option>✨</option></select></label>
   <button class="primary" type="submit">Guardar personaje</button>
   <button class="secondary" type="button" onclick="go('home')">Cancelar</button>
 </form>`;
 document.getElementById("form").onsubmit=saveCharacter;
 togglePhysicalFields();
}
function togglePhysicalFields(){
 const gender=document.getElementById("gender")?.value;
 const p=document.getElementById("penisField"),b=document.getElementById("breastsField"),g=document.getElementById("glutesField");
 if(!p)return;
 p.style.display=(gender==="Hombre"||gender==="Trans")?"block":"none";
 b.style.display=(gender==="Mujer"||gender==="Trans")?"block":"none";
 g.style.display=(gender==="Mujer"||gender==="Trans")?"block":"none";
}
function val(id){return document.getElementById(id)?.value||""}
function saveCharacter(e){
  e.preventDefault();
  const age=Number(val("age"));
  if(age<18){showToast("La edad mínima es 18 años.");return;}

  const gender=val("gender"),chars=getChars();
  const appearance={
    skin:val("skin"),
    bodyType:val("bodyType"),
    penisSize:(gender==="Hombre"||gender==="Trans")?val("penisSize"):"",
    breastSize:(gender==="Mujer"||gender==="Trans")?val("breastSize"):"",
    gluteSize:(gender==="Mujer"||gender==="Trans")?val("gluteSize"):"",
    hairType:val("hairType"),
    hairLength:val("hairLength"),
    hairExtra:val("hairExtra"),
    hairColor:val("hairColor"),
    eyeColor:val("eyeColor"),
    height:val("height")
  };

  const imageRefs={
    skin:getImageSlot("skin",appearance.skin),
    bodyType:getImageSlot("bodyType",appearance.bodyType),
    penisSize:getImageSlot("penisSize",appearance.penisSize),
    breastSize:getImageSlot("breastSize",appearance.breastSize),
    gluteSize:getImageSlot("gluteSize",appearance.gluteSize),
    hairType:getImageSlot("hairType",appearance.hairType),
    hairLength:getImageSlot("hairLength",appearance.hairLength),
    hairExtra:getImageSlot("hairExtra",appearance.hairExtra),
    hairColor:getImageSlot("hairColor",appearance.hairColor),
    eyeColor:getImageSlot("eyeColor",appearance.eyeColor),
    height:getImageSlot("height",appearance.height)
  };

  chars.unshift({
    id:Date.now(),
    name:val("name").trim(),
    age,
    gender,
    nationality:val("nationality").trim(),
    appearance,
    imageRefs,
    personality:val("personality").trim(),
    speech:val("speech"),
    interests:val("interests").trim(),
    description:val("description").trim(),
    relationship:val("relationship").trim(),
    meetingPlace:val("meetingPlace").trim(),
    meetingTime:val("meetingTime").trim(),
    profession:val("profession").trim(),
    initialSituation:val("initialSituation").trim(),
    avatar:val("avatar")
  });

  saveChars(chars);
  showToast("Personaje guardado ✓");
  setTimeout(()=>go("characters"),450);
}

function charMini(c){
 return `<div class="char"><div class="avatar">${c.avatar}</div><div class="info"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.personality)}</div></div><button onclick="openChar(${c.id})">Ver</button></div>`;
}
function renderCharacters(){
 const chars=getChars();
 content.innerHTML=`<div class="sectionhead"><div><h2>Mis personajes</h2><div class="small">${chars.length} personaje(s)</div></div><button class="primary" style="padding:11px 14px;font-size:14px" onclick="go('create')">＋ Crear</button></div>
 ${chars.length?chars.map(charMini).join(""):`<div class="empty">Aquí aparecerán los personajes que crees.</div>`}`;
}
function openChar(id){
 const c=getChars().find(x=>x.id===id);
 if(!c)return;
 const a=c.appearance||{};
 content.innerHTML=`<button class="back" onclick="go('characters')">← Mis personajes</button>
 <div class="char" style="margin-bottom:18px"><div class="avatar" style="width:74px;height:74px;font-size:38px">${c.avatar}</div><div class="info"><div class="name" style="font-size:24px">${esc(c.name)}</div><div class="meta">${c.age} años · ${esc(c.gender||"")} · ${esc(c.speech)}</div></div></div>
 <div class="notice"><b>Nacionalidad:</b> ${esc(c.nationality||"No especificada")}<br><br><b>Apariencia:</b> ${esc(a.skin||"")} · ${esc(a.bodyType||"")} · ${esc(a.height||"")}<br><b>Pelo:</b> ${esc(a.hairType||"")} · ${esc(a.hairLength||"")} · ${esc(a.hairColor||"")} · ${esc(a.hairExtra||"")}<br><b>Ojos:</b> ${esc(a.eyeColor||"")}<br>${a.penisSize?`<b>Tamaño del pene:</b> ${esc(a.penisSize)}<br>`:""}${a.breastSize?`<b>Tamaño de los senos:</b> ${esc(a.breastSize)}<br>`:""}${a.gluteSize?`<b>Tamaño de los glúteos:</b> ${esc(a.gluteSize)}<br>`:""}<br><b>Personalidad:</b> ${esc(c.personality)}<br><br><b>Intereses:</b> ${esc(c.interests||"No especificados")}<br><br><b>Descripción:</b> ${esc(c.description||"Sin descripción.")}</div>
 <br><button class="primary" onclick="openChat(${c.id})">💬 Iniciar chat</button>`;
}

const CHAT_KEY="ai_social_chats_v1";
let activeChatCharacterId=null;
let activeReply=null;

function getChats(){
  try{return JSON.parse(localStorage.getItem(CHAT_KEY)||"{}");}catch(_){return {};}
}
function saveChats(x){localStorage.setItem(CHAT_KEY,JSON.stringify(x));}
function getChatMessages(id){
  const x=getChats(); return Array.isArray(x[String(id)])?x[String(id)]:[];
}
function saveChatMessages(id,messages){
  const x=getChats(); x[String(id)]=messages; saveChats(x);
}
function chatPreview(text,max=120){
  const s=String(text||"").replace(/\s+/g," ").trim();
  return s.length>max?s.slice(0,max-1)+"…":s;
}
function chatTime(ts){
  try{return new Intl.DateTimeFormat("es-MX",{hour:"2-digit",minute:"2-digit"}).format(new Date(ts));}catch(_){return "";}
}
function getActiveCharacter(){return getChars().find(c=>c.id===activeChatCharacterId)||null;}

function openChat(id){
  if(!getChars().some(c=>c.id===id))return;
  activeChatCharacterId=id; activeReply=null; go("chat");
}
function selectReply(id){
  const m=getChatMessages(activeChatCharacterId).find(x=>x.id===id);
  if(!m)return;
  activeReply={id:m.id,text:m.text,sender:m.sender};
  renderReplyBar();
  document.getElementById("chatInput")?.focus();
}
function cancelReply(){activeReply=null;renderReplyBar();}
function renderReplyBar(){
  const bar=document.getElementById("replyBar"); if(!bar)return;
  if(!activeReply){bar.className="reply-bar";bar.innerHTML="";return;}
  const c=getActiveCharacter();
  bar.className="reply-bar show";
  bar.innerHTML=`<div class="reply-content"><b>Respondiendo a ${activeReply.sender==="user"?"tu mensaje":"el mensaje de "+esc(c?.name||"personaje")}</b><span>${esc(chatPreview(activeReply.text))}</span></div><button class="reply-cancel" type="button" onclick="cancelReply()">×</button>`;
}
function renderChatMessage(m){
  const c=getActiveCharacter(), reply=m.replyTo;
  const ref=reply?`<div class="reply-ref"><b>${reply.sender==="user"?"Tú":esc(c?.name||"Personaje")}</b>${esc(chatPreview(reply.text,180))}</div>`:"";
  return `<div class="msg-row ${m.sender==="user"?"user":""}"><div class="msg" data-swipe-id="${esc(String(m.id))}">${ref}<div class="msg-text">${esc(m.text)}</div><span class="msg-time">${chatTime(m.createdAt)}</span></div></div>`;
}
function bindSwipeToReply(){
  document.querySelectorAll("[data-swipe-id]").forEach(el=>{
    let sx=0,sy=0;
    el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
    el.addEventListener("touchmove",e=>{
      const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
      if(dx>0&&Math.abs(dx)>Math.abs(dy)&&dx<90)el.style.transform=`translateX(${dx}px)`;
    },{passive:true});
    el.addEventListener("touchend",e=>{
      const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
      el.style.transform="";
      if(dx>55&&Math.abs(dx)>Math.abs(dy))selectReply(el.dataset.swipeId);
    });
    el.addEventListener("click",()=>selectReply(el.dataset.swipeId));
  });
}
async function sendChatMessage(e){
  e.preventDefault();
  const input=document.getElementById("chatInput"),text=input?.value.trim();
  if(!text || !activeChatCharacterId)return;

  const c=getActiveCharacter();
  const messages=getChatMessages(activeChatCharacterId);
  const userMessage={
    id:"m_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
    sender:"user",text,createdAt:Date.now(),
    replyTo:activeReply?{id:activeReply.id,sender:activeReply.sender,text:activeReply.text}:null
  };

  messages.push(userMessage);
  saveChatMessages(activeChatCharacterId,messages);
  activeReply=null;
  input.value="";
  renderChat();

  const status=document.getElementById("aiStatus");
  if(status){status.textContent="✦ "+c.name+" está escribiendo…";status.style.display="block";}

  try{
    const reply=await requestAIReply(c,messages);
    const aiMessage={
      id:"m_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
      sender:"ai",text:reply,createdAt:Date.now(),
      replyTo:{id:userMessage.id,sender:"user",text:userMessage.text}
    };
    const latest=getChatMessages(activeChatCharacterId);
    latest.push(aiMessage);
    saveChatMessages(activeChatCharacterId,latest);
    renderChat();
  }catch(err){
    console.error(err);
    const latest=getChatMessages(activeChatCharacterId);
    latest.push({
      id:"m_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
      sender:"ai",
      text:"No pude responder en este momento. Comprueba que el servidor de IA esté configurado.",
      createdAt:Date.now(),
      replyTo:{id:userMessage.id,sender:"user",text:userMessage.text},
      error:true
    });
    saveChatMessages(activeChatCharacterId,latest);
    renderChat();
  }
}

async function requestAIReply(character,messages){
  const endpoint=localStorage.getItem("ai_social_api_endpoint")||"";
  if(!endpoint) throw new Error("AI endpoint not configured");

  const payload={
    character:{
      name:character.name,
      age:character.age,
      gender:character.gender,
      nationality:character.nationality,
      appearance:character.appearance||{},
      personality:character.personality||"",
      speech:character.speech||"",
      interests:character.interests||"",
      description:character.description||"",
      context:{
        relationship:character.relationship||"",
        meetingPlace:character.meetingPlace||"",
        meetingTime:character.meetingTime||"",
        profession:character.profession||"",
        initialSituation:character.initialSituation||""
      }
    },
    messages:messages.map(m=>({
      id:m.id,
      role:m.sender==="user"?"user":"assistant",
      content:m.text,
      replyTo:m.replyTo||null
    }))
  };

  const res=await fetch(endpoint,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });

  if(!res.ok) throw new Error("AI server HTTP "+res.status);
  const data=await res.json();
  if(!data.reply) throw new Error("AI server returned no reply");
  return String(data.reply);
}

function renderChat(){
  const c=getActiveCharacter(); if(!c){go("characters");return;}
  const messages=getChatMessages(c.id);
  content.innerHTML=`<button class="back" onclick="go('characters')">← Mis personajes</button>
  <div class="chat-head"><div class="avatar">${c.avatar}</div><div class="info"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.personality||"Personaje de AI Social")}</div></div></div>
  <div class="swipe-hint">Desliza un mensaje hacia la derecha para responder</div>
  <div id="aiStatus" class="small" style="display:none;text-align:center;margin:0 0 8px"></div><div id="chatMessages" class="chat-messages">${messages.length?messages.map(renderChatMessage).join(""):`<div class="empty">Comienza la conversación con ${esc(c.name)}.</div>`}</div>
  <div class="chat-compose"><div id="replyBar" class="reply-bar"></div><form id="chatForm"><textarea id="chatInput" rows="1" maxlength="4000" placeholder="Escribe un mensaje..." autocomplete="off"></textarea><button class="chat-send" type="submit">➤</button></form></div>`;
  renderReplyBar(); bindSwipeToReply();
  document.getElementById("chatForm").onsubmit=sendChatMessage;
  const input=document.getElementById("chatInput");
  input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px";});
  setTimeout(()=>{input.focus();const box=document.getElementById("chatMessages");if(box)box.scrollTop=box.scrollHeight;},0);
}
function renderChats(){
  const chars=getChars(),chats=getChats();
  const items=Object.keys(chats).map(id=>{
    const c=chars.find(x=>String(x.id)===String(id)),ms=Array.isArray(chats[id])?chats[id]:[],last=ms[ms.length-1];
    return c&&last?{c,last}:null;
  }).filter(Boolean).sort((a,b)=>b.last.createdAt-a.last.createdAt);
  content.innerHTML=`<h2>Mis chats</h2><p class="subtitle">Tus conversaciones guardadas en este dispositivo.</p>
  ${items.length?items.map(x=>`<button class="char" style="width:100%;text-align:left;border:1px solid #ffffff14" onclick="openChat(${x.c.id})"><div class="avatar">${x.c.avatar}</div><div class="info"><div class="name">${esc(x.c.name)}</div><div class="meta">${esc(chatPreview(x.last.text))}</div></div><span class="small">${chatTime(x.last.createdAt)}</span></button>`).join(""):`<div class="empty">Todavía no hay conversaciones.<br><br>${chars.length?"Abre un personaje y pulsa «Iniciar chat».":"Primero crea un personaje."}</div>`}`;
}
function configureAIEndpoint(){
  const current=localStorage.getItem("ai_social_api_endpoint")||"";
  const endpoint=prompt("URL del servidor de IA:",current);
  if(endpoint===null)return;
  localStorage.setItem("ai_social_api_endpoint",endpoint.trim());
  showToast(endpoint.trim()?"Servidor de IA guardado ✓":"Servidor de IA borrado");
}

function renderProfile(){
 content.innerHTML=`<h2>Perfil</h2><p class="subtitle">Configuración básica de tu cuenta.</p><div class="notice"><b>AI Social</b><br><br>Chat con IA conectado mediante un servidor seguro.<br>Los personajes y chats actuales siguen guardándose localmente en este dispositivo.</div><br><button class="primary" onclick="configureAIEndpoint()">⚙️ Configurar servidor de IA</button>`;
}
function showToast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}


function migrateLegacyCharacters(){
  const legacyKey="ai_social_characters_v6";
  const current=localStorage.getItem(KEY);
  const legacy=localStorage.getItem(legacyKey);
  if(!current && legacy){
    try{
      const chars=JSON.parse(legacy)||[];
      chars.forEach(c=>{
        c.imageRefs=c.imageRefs||{};
        Object.keys(IMAGE_SLOTS).forEach(k=>{
          if(!(k in c.imageRefs)) c.imageRefs[k]=null;
        });
      });
      saveChars(chars);
    }catch(_){}
  }
}

migrateLegacyCharacters();
render(location.hash.slice(1)||"home");
</script>
