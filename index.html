<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08061b">
<title>AI Social</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08061b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:430px;margin:auto;min-height:100vh;background:linear-gradient(145deg,#08061b,#14082e)}
header{height:70px;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;background:#0b0820;position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff12}
.logo{font-size:24px;font-weight:900;background:linear-gradient(90deg,#ff3b9d,#8c5cff,#31a7ff);-webkit-background-clip:text;color:transparent}
.profile{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff2b87,#7d4dff)}
main{padding:20px 16px 100px}
.view{display:none}.view.active{display:block}
h1{font-size:29px;margin:6px 0}.sub{color:#aaa7c2;margin:0 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{min-height:150px;border:0;border-radius:22px;padding:17px;color:#fff;text-align:left;box-shadow:0 12px 30px #0005}
.card:nth-child(1){background:linear-gradient(145deg,#e81f91,#812be7)}
.card:nth-child(2){background:linear-gradient(145deg,#ff7a18,#ef245f)}
.card:nth-child(3){background:linear-gradient(145deg,#178cff,#154bd8)}
.card:nth-child(4){background:linear-gradient(145deg,#7d32ed,#3620a6)}
.card .emoji{font-size:30px}.card h3{margin:12px 0 5px}.card p{margin:0;font-size:13px;color:#f4eaff}
.primary{width:100%;padding:15px;border:0;border-radius:15px;background:linear-gradient(90deg,#ff2b87,#813cff);color:#fff;font-weight:800;font-size:16px}
.secondary{width:100%;padding:13px;border:1px solid #ffffff20;border-radius:15px;background:#15122f;color:#fff;font-weight:700;margin-top:10px}
.back{border:0;background:none;color:#bbb5d1;padding:0 0 10px;font-size:15px}
.form label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}
.form input,.form textarea,.form select{width:100%;padding:13px;border:1px solid #302a4d;border-radius:14px;background:#12102b;color:#fff;font-size:16px}
.form textarea{min-height:100px;resize:none}
.character{display:flex;align-items:center;gap:12px;padding:12px;background:#12102b;border:1px solid #ffffff12;border-radius:18px;margin-bottom:10px}
.characterAvatar{width:58px;height:58px;border-radius:16px;background:linear-gradient(145deg,#311a57,#14122c);display:grid;place-items:center;font-size:30px}
.characterInfo{flex:1}.characterInfo strong{display:block}.characterInfo span{font-size:12px;color:#aaa7c2}
.empty{text-align:center;padding:30px 15px;border:1px dashed #393354;border-radius:18px;color:#aaa7c2}
.profileAvatar{height:220px;border-radius:24px;background:linear-gradient(145deg,#311a57,#14122c);display:grid;place-items:center;font-size:90px}
.info{padding:15px;border:1px solid #ffffff12;background:#12102b;border-radius:17px;margin:10px 0}.info strong{display:block;margin-bottom:5px}.info span{color:#aaa7c2;font-size:14px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:74px;background:#0d0a21f2;border-top:1px solid #ffffff12;display:flex;justify-content:space-around;align-items:center;z-index:10}
nav button{border:0;background:none;color:#77748d;font-size:10px}nav b{display:block;font-size:21px;margin-bottom:2px}nav .active{color:#ff4a9c}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">AI Social</div><div class="profile">✦</div></header>
<main>

<section id="home" class="view active">
<h1>¡Hola! 👋</h1>
<div class="sub">Crea y conoce personajes que cobran vida con IA.</div>
<div class="grid">
<button class="card" onclick="showView('characters')"><div class="emoji">👥</div><h3>Mis personajes</h3><p>Gestiona tus personajes.</p></button>
<button class="card" onclick="showView('create')"><div class="emoji">✨</div><h3>Crear personaje</h3><p>Diseña uno nuevo.</p></button>
<button class="card" onclick="showView('chats')"><div class="emoji">💬</div><h3>Mis chats</h3><p>Continúa tus conversaciones.</p></button>
<button class="card"><div class="emoji">🌌</div><h3>Explorar</h3><p>Descubre personajes.</p></button>
</div>
</section>

<section id="characters" class="view">
<button class="back" onclick="showView('home')">← Inicio</button>
<h1>Mis personajes</h1><div class="sub">Tus personajes creados.</div>
<div id="characterList"></div>
<button class="primary" onclick="showView('create')">＋ Crear personaje</button>
</section>

<section id="create" class="view">
<button class="back" onclick="showView('home')">← Inicio</button>
<h1>Crear personaje</h1>
<div class="sub">Completa los datos básicos para crear tu personaje.</div>
<div class="form">
<label>Nombre</label>
<input id="name" placeholder="Ej. Alex">
<label>Edad</label>
<input id="age" type="number" min="18" placeholder="18 o más">
<label>Personalidad</label>
<input id="personality" placeholder="Ej. divertido, seguro, curioso">
<label>Forma de hablar</label>
<select id="speech"><option>Natural y amistosa</option><option>Divertida y juguetona</option><option>Tranquila y reflexiva</option><option>Directa y segura</option><option>Elegante y seria</option></select>
<label>Gustos e intereses</label>
<input id="interests" placeholder="Ej. música, videojuegos, viajes">
<label>Descripción</label>
<textarea id="description" placeholder="Cuéntame quién es este personaje..."></textarea>
<label>Avatar</label>
<select id="avatar"><option>🌙</option><option>🌸</option><option>🔥</option><option>⭐</option><option>🦋</option><option>🌊</option><option>🖤</option><option>💜</option></select>
<button class="primary" onclick="saveCharacter()">✨ Guardar personaje</button>
<button class="secondary" onclick="clearForm()">Limpiar</button>
</div>
</section>

<section id="profileView" class="view">
<button class="back" onclick="showView('characters')">← Mis personajes</button>
<div id="profileContent"></div>
</section>

<section id="chats" class="view">
<button class="back" onclick="showView('home')">← Inicio</button>
<h1>Mis chats</h1><div class="sub">Aquí conectaremos la IA después.</div>
<div class="empty">Todavía no tienes conversaciones.</div>
</section>

</main>
<nav>
<button onclick="showView('home')"><b>⌂</b>Inicio</button>
<button onclick="showView('characters')"><b>◉</b>Personajes</button>
<button onclick="showView('chats')"><b>◌</b>Chats</button>
<button onclick="showView('create')"><b>＋</b>Crear</button>
<button><b>♙</b>Perfil</button>
</nav>
</div>

<script>
var STORAGE_KEY="ai_social_characters";

function showView(id){
  var views=document.querySelectorAll(".view");
  for(var i=0;i<views.length;i++){views[i].classList.remove("active");}
  var target=document.getElementById(id);
  if(target){target.classList.add("active");}
  if(id==="characters"){renderCharacters();}
  window.scrollTo(0,0);
}

function getCharacters(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");}
  catch(e){return [];}
}

function saveCharacters(list){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(list));
}

function escapeText(text){
  var div=document.createElement("div");
  div.textContent=text||"";
  return div.innerHTML;
}

function clearForm(){
  document.getElementById("name").value="";
  document.getElementById("age").value="";
  document.getElementById("personality").value="";
  document.getElementById("speech").value="Natural y amistosa";
  document.getElementById("interests").value="";
  document.getElementById("description").value="";
  document.getElementById("avatar").value="🌙";
}

function saveCharacter(){
  var name=document.getElementById("name").value.trim();
  var age=parseInt(document.getElementById("age").value,10);
  if(!name){alert("Escribe un nombre.");return;}
  if(isNaN(age)||age<18){alert("La edad debe ser 18 años o más.");return;}

  var character={
    id:String(Date.now()),
    name:name,
    age:age,
    personality:document.getElementById("personality").value.trim(),
    speech:document.getElementById("speech").value,
    interests:document.getElementById("interests").value.trim(),
    description:document.getElementById("description").value.trim(),
    avatar:document.getElementById("avatar").value
  };

  var list=getCharacters();
  list.push(character);
  saveCharacters(list);
  clearForm();
  showView("characters");
}

function renderCharacters(){
  var container=document.getElementById("characterList");
  var list=getCharacters();

  if(!list.length){
    container.innerHTML='<div class="empty">✨<br><br>Aún no tienes personajes.<br>¡Crea el primero!</div>';
    return;
  }

  var html="";
  for(var i=0;i<list.length;i++){
    var c=list[i];
    html+='<button class="character" style="width:100%;text-align:left;color:white" onclick="openProfile(\''+c.id+'\')">';
    html+='<div class="characterAvatar">'+escapeText(c.avatar)+'</div>';
    html+='<div class="characterInfo"><strong>'+escapeText(c.name)+'</strong>';
    html+='<span>'+escapeText(c.personality||"Personalidad por definir")+'</span></div></button>';
  }
  container.innerHTML=html;
}

function openProfile(id){
  var list=getCharacters(), c=null;
  for(var i=0;i<list.length;i++){if(list[i].id===id){c=list[i];break;}}
  if(!c)return;

  document.getElementById("profileContent").innerHTML=
    '<div class="profileAvatar">'+escapeText(c.avatar)+'</div>'+
    '<h1>'+escapeText(c.name)+'</h1>'+
    '<div class="sub">Edad: '+c.age+'</div>'+
    '<div class="info"><strong>🎭 Personalidad</strong><span>'+escapeText(c.personality||"No definida")+'</span></div>'+
    '<div class="info"><strong>🗣️ Forma de hablar</strong><span>'+escapeText(c.speech)+'</span></div>'+
    '<div class="info"><strong>💜 Gustos e intereses</strong><span>'+escapeText(c.interests||"No definidos")+'</span></div>'+
    '<div class="info"><strong>📝 Descripción</strong><span>'+escapeText(c.description||"Sin descripción")+'</span></div>'+
    '<button class="primary" onclick="alert(\'El chat real lo conectaremos en el siguiente paso. 🚀\')">💬 Iniciar chat</button>'+
    '<button class="secondary" onclick="removeCharacter(\''+c.id+'\')">🗑️ Eliminar personaje</button>';

  showView("profileView");
}

function removeCharacter(id){
  var list=getCharacters().filter(function(c){return c.id!==id;});
  saveCharacters(list);
  showView("characters");
}

renderCharacters();
</script>
</body>
</html>
